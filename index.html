<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <title>Home Medicare - Choose Language</title>
</head>
<body data-locale="en-US">
  <div class="container" style="display:flex;gap:24px;align-items:center;justify-content:space-between;">

      <img src="logo.jpg" alt="Home Medicare Logo" class="site-logo" />
      <h1 style="font-family:'Playfair Display', serif;">Welcome to Home Medicare</h1>

      <div style="display:flex;gap:12px;justify-content:flex-start;">

    </div>
    <div style="flex:1;max-width:400px;">
      <img src="homecare bg.png" alt="Home Care Services" style="width:100%;border-radius:12px;box-shadow:0 10px 30px rgba(15,23,36,0.1);mask-image:linear-gradient(90deg,transparent 0px,black 7px);-webkit-mask-image:linear-gradient(90deg,transparent 0px,black 7px);" />
